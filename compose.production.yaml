name: ${COMPOSE_PROJECT_NAME:-ead2026-production}

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.production
            target: app
            args:
                APP_BUILD_SHA: ${APP_BUILD_SHA:?APP_BUILD_SHA must identify the release}
        image: ${APP_IMAGE:-ead2026/app}:${APP_BUILD_SHA:?APP_BUILD_SHA must identify the release}
        restart: unless-stopped
        expose:
            - '9000'
        environment: &laravel-environment
            APP_NAME: ${APP_NAME:-Sistema de EAD}
            APP_ENV: ${APP_ENV:?APP_ENV is required}
            APP_KEY: ${APP_KEY:?APP_KEY is required}
            APP_DEBUG: ${APP_DEBUG:?APP_DEBUG is required}
            APP_URL: ${APP_URL:?APP_URL is required}
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES is required}
            TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: '3306'
            DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
            DB_USERNAME: ${DB_RUNTIME_USERNAME:?DB_RUNTIME_USERNAME is required}
            DB_PASSWORD: ${DB_RUNTIME_PASSWORD:?DB_RUNTIME_PASSWORD is required}
            FILESYSTEM_DISK: ${FILESYSTEM_DISK:?FILESYSTEM_DISK is required}
            MEDIA_DISK: ${MEDIA_DISK:?MEDIA_DISK is required}
            SESSION_DRIVER: ${SESSION_DRIVER:-database}
            SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:?SESSION_SECURE_COOKIE is required}
            SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY:-true}
            SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
            LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
            LOG_LEVEL: ${LOG_LEVEL:-notice}
            LOG_STDERR_FORMATTER: ${LOG_STDERR_FORMATTER:-Monolog\Formatter\JsonFormatter}
            MAIL_MAILER: ${MAIL_MAILER:?MAIL_MAILER is required}
            MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
            MAIL_PORT: ${MAIL_PORT:?MAIL_PORT is required}
            MAIL_USERNAME: ${MAIL_USERNAME:-}
            MAIL_PASSWORD: ${MAIL_PASSWORD:-}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is required}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Sistema de EAD}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
            OPS_MIGRATION_MANIFEST: ${OPS_MIGRATION_MANIFEST:-release/migrations.manifest.json}
            OPS_QUEUE_REQUIRED: ${OPS_QUEUE_REQUIRED:-false}
            OPS_OUTBOX_MAX_AGE_SECONDS: ${OPS_OUTBOX_MAX_AGE_SECONDS:-300}
            OPS_STORAGE_MIN_FREE_BYTES: ${OPS_STORAGE_MIN_FREE_BYTES:-1073741824}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
            CORS_SUPPORTS_CREDENTIALS: ${CORS_SUPPORTS_CREDENTIALS:-false}
        volumes:
            - production_storage:/var/www/html/storage
            - production_cache:/var/www/html/bootstrap/cache
        networks:
            - private
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'php', 'artisan', 'ops:migrate', '--manifest-only', '--no-interaction']
            interval: 10s
            timeout: 5s
            retries: 6

    web:
        build:
            context: .
            dockerfile: Dockerfile.production
            target: web
            args:
                APP_BUILD_SHA: ${APP_BUILD_SHA:?APP_BUILD_SHA must identify the release}
        image: ${WEB_IMAGE:-ead2026/web}:${APP_BUILD_SHA:?APP_BUILD_SHA must identify the release}
        restart: unless-stopped
        environment:
            APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
            CADDY_TLS_DIRECTIVE: ${CADDY_TLS_DIRECTIVE:?Use an ACME email in production; use internal only for local rehearsal}
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
        volumes:
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - private
            - edge
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1/up || exit 1']
            interval: 30s
            timeout: 5s
            retries: 3

    db:
        build:
            context: docker/mysql
            dockerfile: Dockerfile
        image: ${DB_IMAGE:-ead2026/mysql}:8.4
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}
            MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
            MYSQL_USER: ${DB_BOOTSTRAP_USERNAME:?DB_BOOTSTRAP_USERNAME is required}
            MYSQL_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:?DB_BOOTSTRAP_PASSWORD is required}
            DB_BOOTSTRAP_USERNAME: ${DB_BOOTSTRAP_USERNAME:?DB_BOOTSTRAP_USERNAME is required}
            DB_RUNTIME_USERNAME: ${DB_RUNTIME_USERNAME:?DB_RUNTIME_USERNAME is required}
            DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?DB_RUNTIME_PASSWORD is required}
            DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:?DB_MIGRATION_USERNAME is required}
            DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?DB_MIGRATION_PASSWORD is required}
        expose:
            - '3306'
        volumes:
            - production_db_data:/var/lib/mysql
        networks:
            - private
        healthcheck:
            test: ['CMD-SHELL', 'MYSQL_PWD="$${DB_RUNTIME_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u"$${DB_RUNTIME_USERNAME}" --silent']
            interval: 10s
            timeout: 5s
            retries: 10

    scheduler:
        image: ${APP_IMAGE:-ead2026/app}:${APP_BUILD_SHA:?APP_BUILD_SHA must identify the release}
        restart: unless-stopped
        command: ['php', 'artisan', 'schedule:work']
        environment: *laravel-environment
        volumes:
            - production_storage:/var/www/html/storage
            - production_cache:/var/www/html/bootstrap/cache
        networks:
            - private
        depends_on:
            db:
                condition: service_healthy

    worker:
        profiles: ['worker']
        image: ${APP_IMAGE:-ead2026/app}:${APP_BUILD_SHA:?APP_BUILD_SHA must identify the release}
        restart: unless-stopped
        command: ['php', 'artisan', 'queue:work', 'database', '--sleep=3', '--tries=3', '--timeout=90', '--no-interaction']
        environment: *laravel-environment
        volumes:
            - production_storage:/var/www/html/storage
            - production_cache:/var/www/html/bootstrap/cache
        networks:
            - private
        depends_on:
            db:
                condition: service_healthy

networks:
    edge:
        driver: bridge
    private:
        driver: bridge
        internal: true

volumes:
    production_db_data:
        name: ${PRODUCTION_DB_VOLUME:-ead2026-production-db}
    production_storage:
        name: ${PRODUCTION_STORAGE_VOLUME:-ead2026-production-storage}
    production_cache:
        name: ${PRODUCTION_CACHE_VOLUME:-ead2026-production-cache}
    caddy_data:
        name: ${CADDY_DATA_VOLUME:-ead2026-production-caddy-data}
    caddy_config:
        name: ${CADDY_CONFIG_VOLUME:-ead2026-production-caddy-config}
